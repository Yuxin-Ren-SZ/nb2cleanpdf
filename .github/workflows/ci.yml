name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      # `zsh -n` exits 1 after any `! cmd` even when the syntax is fine,
      # so a clean parse is "nothing printed", not the exit status.
      - name: zsh syntax
        run: |
          for f in nb2cleanpdf tests/run-tests.zsh; do
            out=$(zsh -n "$f" 2>&1 || true)
            if [ -n "$out" ]; then echo "$f: $out"; exit 1; fi
          done
      - name: install.sh (POSIX sh)
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh
      - name: python syntax
        run: python3 -m py_compile tests/make_fixture.py

  test:
    name: test (${{ matrix.engine }}, ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,  engine: chrome, conda: true }
          - { os: ubuntu-latest, engine: chrome }
          - { os: macos-latest,  engine: chrome-cli }
          - { os: ubuntu-latest, engine: chrome-cli }
          - { os: ubuntu-latest, engine: webpdf }
          - { os: ubuntu-latest, engine: latex }
          - { os: ubuntu-latest, engine: none, conda: true }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh

      # the runner image has no CJK fonts; without them 中文 renders as boxes
      - name: install CJK fonts
        if: runner.os == 'Linux' && matrix.engine != 'none' && matrix.engine != 'latex'
        run: sudo apt-get install -y -q fonts-noto-cjk

      - name: install LaTeX + pandoc
        if: matrix.engine == 'latex'
        run: >
          sudo apt-get install -y -q --no-install-recommends
          pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended
          texlive-plain-generic texlive-luatex lmodern

      # micromamba only (no env): the suite then also tests real conda envs
      - name: install micromamba
        if: matrix.conda
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: none
          post-cleanup: none

      - name: browser in use
        if: startsWith(matrix.engine, 'chrome')
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          else
            google-chrome --version
          fi

      - name: run tests
        run: zsh tests/run-tests.zsh --engine ${{ matrix.engine }}

      - name: upload PDFs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nb2cleanpdf-${{ matrix.engine }}-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            tests/.work/**/*.pdf
            tests/.work/**/logs/*.log

  # Windows Subsystem for Linux. GitHub's Windows runners can't nest virtualisation,
  # so this is WSL 1. The repo is checked out on the Windows side (/mnt/d/…); the
  # suite runs from a copy in the Linux home, where WSL users keep their projects.
  wsl:
    name: test (${{ matrix.engine }}, wsl)
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        engine: [none, chrome-cli]
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@v5
      - uses: Vampire/setup-wsl@v5
        with:
          distribution: Ubuntu-24.04
          additional-packages: zsh curl ca-certificates python3-venv fonts-noto-cjk

      - name: install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: install Google Chrome
        if: matrix.engine == 'chrome-cli'
        run: |
          curl -fsSLo /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -q /tmp/chrome.deb
          google-chrome --version

      - name: line endings survived the Windows checkout
        run: |
          if grep -lq $'\r' nb2cleanpdf install.sh tests/run-tests.zsh; then echo "CRLF found"; exit 1; fi

      - name: run tests
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rm -rf ~/nb2cleanpdf && cp -r . ~/nb2cleanpdf
          cd ~/nb2cleanpdf && zsh tests/run-tests.zsh --engine ${{ matrix.engine }}

      - name: collect PDFs and logs
        if: always()
        run: |
          out=$PWD/wsl-out; rm -rf "$out"; mkdir "$out"
          cd ~/nb2cleanpdf/tests 2>/dev/null || exit 0
          find .work \( -name '*.pdf' -o -path '*/logs/*.log' \) -print0 | xargs -0 -r cp --parents -t "$out"

      - name: upload PDFs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nb2cleanpdf-${{ matrix.engine }}-wsl
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            wsl-out/**/*.pdf
            wsl-out/**/logs/*.log
